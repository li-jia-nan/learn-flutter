plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.douyin.nativehost'
    compileSdk 36
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'com.example.douyin.nativehost'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0'

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        profile {
            initWith debug
            matchingFallbacks = ['debug']
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    // This is a Flutter library dependency, not the existing standalone :app.
    implementation project(':flutter')
    implementation 'androidx.fragment:fragment:1.9.1'
    // Keep API 36 compatibility; newer Core versions require compileSdk 37.
    implementation 'androidx.core:core-ktx:1.17.0'
}
