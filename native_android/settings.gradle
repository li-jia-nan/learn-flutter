pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    // Flutter's generated library also declares repositories; prefer these
    // centralized repositories instead of FAIL_ON_PROJECT_REPOS.
    repositoriesMode = RepositoriesMode.PREFER_SETTINGS
    def storageUrl = System.getenv('FLUTTER_STORAGE_BASE_URL') ?: 'https://storage.googleapis.com'
    repositories {
        google()
        mavenCentral()
        maven { url = uri("${storageUrl}/download.flutter.io") }
    }
}

rootProject.name = 'DouyinHybridAndroid'
include ':app'

// This script includes :flutter and the module's Flutter plugins, and registers
// Flutter's Gradle plugin build. Regenerate it with flutter pub get.
def flutterModule = file('../flutter_module')
def flutterInclude = new File(flutterModule, '.android/include_flutter.groovy')
if (!flutterInclude.isFile()) {
    throw new GradleException('Run `cd ../flutter_module && flutter pub get` before syncing or building native_android.')
}
setBinding(new Binding([gradle: this]))
apply from: flutterInclude
