buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        // AGP 9.1 defaults to Kotlin 2.2.10; Flutter 3.47 needs >= 2.2.20.
        // Upgrade the compiler used by built-in Kotlin without applying KGP.
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.0'
    }
}

plugins {
    id 'com.android.application' version '9.1.0' apply false
    id 'com.android.library' version '9.1.0' apply false
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
    subprojects.each { delete it.layout.buildDirectory }
}
